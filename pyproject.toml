[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indie-beets"
# Mirrors the pinned beets version below — indie-beets is just a standalone,
# batteries-included build of beets, so its release number IS the beets version.
# The authoritative release version is computed from the bundled beets at
# package time (scripts/package.py); keep this in sync when bumping beets.
version = "2.13.1"
description = "Standalone, batteries-included executable builds of the beets music manager"
requires-python = ">=3.10"
readme = "README.md"

# Pinned so CI and local builds are reproducible. beets is the app we freeze;
# the rest are the optional runtime deps of the plugins we want to ship.
# (History: stayed on 2.10.0 while beets-filetote < 1.3.5 imported symbols beets
# 2.11.0 renamed; filetote 1.3.5 fixed that -> 2.11.0; filetote 1.3.6 verified on
# 2.12.0, then on 2.13.0. beets 2.13.0 then broke filetote 1.3.6 itself
# (DefaultTemplateFunctions lost its default args, MULTIDISC_PATTERNS became
# str) — filetote 1.3.7 is the fix, so the two must move together. Now 2.13.1.)
dependencies = [
    "beets==2.13.1",
    # chroma plugin: acoustic fingerprinting via Chromaprint/AcoustID
    "pyacoustid",
    # common metadata/network deps pulled in by core + popular plugins
    "requests",
    "mutagen",
    "pyyaml",
    # lyrics plugin: HTML scraping of lyrics pages
    "beautifulsoup4",
    "langdetect",
    # lastgenre plugin: Last.fm genre tagging. Pinned: pylast 7.1.0 swapped its
    # HTTP stack to the brand-new httpx2 — pin to the version we
    # evaluated so a future pylast/httpx2 churn can't slip into a build unvetted.
    "pylast==7.1.0",
    # pylast 7.1.0's HTTP stack. Pinned explicitly because Windows/Linux install
    # from this file while macOS installs the frozen closure — leaving it to float
    # made the platforms ship different versions from the same commit. httpx2 is a
    # very young project (2.9.1 -> 2.12.0 within a month), so it moves on our terms.
    "httpx2==2.12.0",
    # discogs plugin: Discogs as an autotagger metadata source. This is what
    # beets' own `discogs` extra installs; the spotify plugin needs only requests.
    "python3-discogs-client",
    # The remaining beets extras, so every plugin beets ships is usable out of
    # the bundle. (Only two of beets' extras are missing, and neither can be
    # bundled: `autobpm` needs numba/llvmlite, which publish no x86_64 macOS
    # wheels and would break the universal2 build, and `metasync` needs
    # dbus-python, which requires native dbus headers to build. `reflink` is
    # also left out: its newest wheels are cp36-Windows-only, so every other
    # platform would have to compile it through cffi. `py7zr` is skipped as
    # well: beets' extractor calls archive.infolist(), which NO py7zr release
    # provides, so .7z import raises instead of working — and py7zr alone drags
    # in ~10 MB of compression libraries.)
    "requests-oauthlib",  # beatport, tidal
    "titlecase",          # titlecase
    "python-mpd2",        # mpdstats
    "soco",               # sonosupdate
    "rarfile",            # importing music straight out of .rar archives
    "flask",              # web, aura
    "flask-cors",         # web, aura
    "pyxdg",              # thumbnails
    # extra bundled plugins (native, batteries-included)
    # Pinned, not floating: Windows/Linux install from this file while macOS
    # installs the frozen closure, so an unpinned plugin means the platforms
    # ship different versions from one commit. These also track beets closely
    # and have broken on beets majors before (see filetote history below).
    "beetcamp==0.24.3",        # Bandcamp metadata source -> beetsplug.bandcamp
    "beets-filetote==1.3.7",   # non-music files on import -> beetsplug.filetote
    "beets-vgmdb==1.3.5",      # VGMdb metadata source -> beetsplug.VGMplug
    "lxml",              # parser used by beets-vgmdb (BeautifulSoup "lxml")
]
# NOTE: beets-vgmdb declares a dependency on `pathlib` — that's the obsolete PyPI
# backport (pathlib is stdlib since 3.4) and it BREAKS on modern Python / Nuitka.
# It must be uninstalled after `pip install` (CI does this) and is never listed in
# requirements-build.txt.

[project.optional-dependencies]
# The build toolchain. Kept separate so the frozen app doesn't carry it.
build = [
    "nuitka==4.1.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.indie-beets]
# Release version is "<beets version>-<build>" (e.g. 2.10.0-1). The build number
# is computed automatically at release time from existing git tags
# (scripts/next_version.py) — no static value to maintain here.

# Single source of truth for which beets plugins are "batteries included".
# Consumed by scripts/build.py to force-include the right modules for Nuitka.
bundled-plugins = [
    "chroma",
    "convert",
    "replaygain",
    "fetchart",
    "lyrics",
    "lastgenre",
    "duplicates",
    "info",
    "missing",
    "scrub",
    "deezer",        # Deezer as an autotagger metadata source
    "discogs",       # Discogs as an autotagger metadata source
    "spotify",       # Spotify as an autotagger metadata source
    "bandcamp",
    "filetote",
    "VGMplug",
]
