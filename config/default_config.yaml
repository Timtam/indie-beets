# indie-beets configuration
#
# This file was copied into `beets-data/` next to the program the first time you
# ran it, and it is yours to edit — indie-beets never overwrites it.
#
# PORTABLE BY DEFAULT: the bundle keeps beets' own files (this config, the
# library database, the import state and beets' database backups) in that
# `beets-data/` folder, so moving or deleting the bundle takes everything with
# it and nothing is left behind in your system's config directory. To use a
# different location instead, set the BEETSDIR environment variable before
# starting beets — that overrides all of this.
#
# Your MUSIC is a separate matter and is NOT stored in the bundle: beets manages
# it wherever `directory` points (see below). Give it an absolute path if you
# want your library somewhere specific.

# Where beets puts imported music. Defaults to your Music folder.
# directory: ~/Music
#
# For a fully self-contained setup (e.g. a USB stick), point it inside the
# bundle instead — paths are relative to this file:
# directory: music

# Plugins that ship with the bundle. The user can trim or extend this list.
plugins:
  - musicbrainz   # MusicBrainz: beets' primary autotagger source. beets enables it by
                 # default, but listing plugins here replaces beets' default list, so it
                 # must be named explicitly or autotagging silently loses MusicBrainz.
  - chroma        # acoustic fingerprinting (uses bundled fpcalc)
  - convert       # transcoding (uses bundled ffmpeg)
  - replaygain    # loudness normalization
  - fetchart
  - lyrics
  - lastgenre
  - duplicates
  - info
  - missing
  - scrub
  - deezer       # Deezer as an autotagger metadata source
  - spotify      # Spotify as an autotagger metadata source
  - bandcamp     # Bandcamp as an autotagger metadata source (beetcamp)
  - filetote     # carry along non-music files (artwork, logs, …) on import
  - VGMplug      # VGMdb as an autotagger metadata source (beets-vgmdb)

# ReplayGain: the ffmpeg backend is the most portable since we bundle ffmpeg.
replaygain:
  backend: ffmpeg

# convert: rely on the bundled ffmpeg on PATH (runtime_env wires this up).
convert:
  ffmpeg: ffmpeg

# The `discogs` plugin is bundled but NOT enabled above, because it authenticates
# as soon as it loads: without a token it starts an interactive OAuth login on
# every single beets command. Get a personal token at
# https://www.discogs.com/settings/developers , then add `discogs` to the plugins
# list above and put the token here:
# discogs:
#   user_token: YOUR_TOKEN_HERE

# The `beatport4` plugin (Beatport as a metadata source) is bundled but NOT
# enabled either, because it needs a Beatport account. Whenever it cannot log in
# (no login set, offline, wrong password), it stops every import to ask for a
# token (press Enter to skip Beatport), and unattended imports fail. To turn it
# on, add `beatport4` to the plugins list above and put your Beatport login here.
# It is stored in this file as plain text. Keep the single quotes; if your login
# contains a ' itself, type it twice ('').
# beatport4:
#   username: 'YOUR_BEATPORT_USERNAME'
#   password: 'YOUR_BEATPORT_PASSWORD'
# Do not enable beets' own `beatport` or `bpsync`, instead of or alongside it:
# Beatport retired the API they use, and either one adds about 20 seconds (on
# Windows; possibly longer elsewhere) to every beets command.
